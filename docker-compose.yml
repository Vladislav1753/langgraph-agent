services:
  app:
    build:
      context: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_DOCKER_HOST:-http://host.docker.internal:3000}
      LANGFUSE_BASE_URL: ${LANGFUSE_DOCKER_BASE_URL:-http://host.docker.internal:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      PYTHONPATH: /app
    volumes:
      - .:/app
