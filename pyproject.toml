    "mypy>=2.1.0",
    "pinecone>=9.0.1",
    "pre-commit>=4.6.0",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "ruff>=0.15.14",
    "uvicorn[standard]>=0.48.0",
